<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pemilihan Ketua &amp; Wakil Ketua OSIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#fff5f2;--tint:#ffe9df;--tx:#1b1b1f;--mut:#6b6b76;--acc:#ff5a3c;--g:linear-gradient(135deg,#ff7a2f 0%,#ff3d5a 100%);--bd:#f0e6e1;--ok:#15803d;--bad:#d62839;--c1:#ff5a3c;--c2:#2b2622;
--f:"Inter",system-ui,sans-serif;--sh:0 10px 30px rgba(255,90,60,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f)}
nav{display:flex;gap:4px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--bd);flex-wrap:wrap;align-items:center}
nav a{padding:8px 14px;border-radius:99px;color:var(--mut);font-weight:700;cursor:pointer;font-size:.9rem}
nav a.on{background:var(--tint);color:var(--acc)}
main{max-width:1000px;margin:0 auto;padding:18px}
h1{margin:.2em 0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mut)}
.card{background:#fff;border:1px solid var(--bd);border-radius:24px;padding:16px;margin-bottom:12px}
input,textarea,button{font:inherit;color:var(--tx)}
input,textarea{width:100%;padding:14px 16px;border:1.5px solid var(--bd);border-radius:16px;background:#fff}
input:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,90,60,.14)}
button:focus-visible{outline:3px solid rgba(255,90,60,.4);outline-offset:2px}
button{padding:12px 22px;border:0;border-radius:99px;background:var(--g);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(255,90,60,.28)}
button.sec{background:#fff;border:1.5px solid var(--bd);color:var(--tx);box-shadow:none}
button.dan{background:#fff;border:1.5px solid var(--bad);color:var(--bad);box-shadow:none}
button:disabled{background:#ece6e2;color:#a69d96;box-shadow:none;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{padding:12px 14px;border-radius:16px;margin-top:10px;font-weight:700}
.msg.ok{background:#e8f6ed;color:var(--ok)}.msg.er{background:#fdecee;color:var(--bad)}
.logo{width:clamp(44px,6vw,88px);height:clamp(44px,6vw,88px);object-fit:contain;flex:none}
.fb{display:grid;place-items:center;border-radius:50%;background:var(--g);color:#fff;font:800 clamp(.7rem,1.3vw,1.3rem)/1 var(--f);text-align:center}
.photos{display:flex;justify-content:center;gap:8px}
.ph{width:clamp(90px,14vw,230px);aspect-ratio:3/4;border-radius:18px;background:linear-gradient(160deg,#ffe3d6,#ffb199);object-fit:cover;display:block}
.badge{display:inline-block;background:var(--tint);color:var(--acc);font-weight:800;font-size:.8rem;padding:6px 14px;border-radius:99px}
/* === bilik: beranda === */
.home{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:clamp(32px,7vh,64px);align-items:center;text-align:center;color:#fff;background:linear-gradient(180deg,#ff7a3d 0%,#ff4d5e 100%);padding:6vh 24px;overflow:hidden}
.cont{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:rgba(255,255,255,.35);stroke-width:1.2}
.cont path{vector-effect:non-scaling-stroke}
.hm,.hb{position:relative;width:100%;max-width:460px}
.hm .logo{width:96px;height:96px;background:#fff;border-radius:50%;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.hm .fb{background:#fff;color:var(--acc)}
.hm h1{font-size:clamp(1.6rem,6vw,2.4rem);margin:22px 0 10px;line-height:1.15}
.hm p{margin:0;font-size:1.1rem;opacity:.95}
.pill-w{width:100%;padding:18px;border-radius:99px;background:#fff;color:var(--acc);font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 10px 24px rgba(120,20,20,.22)}
.closed{padding:18px;border:2px solid rgba(255,255,255,.8);border-radius:99px;font-weight:800}
.sch{margin-top:16px;font-weight:700;opacity:.9}
/* bilik: memilih */
.vt{max-width:640px;margin:0 auto;padding:0 18px 20px}
.vh{display:flex;align-items:center;gap:12px;padding:16px 0}
.vh b{display:block;font-size:1.05rem;line-height:1.2}.vh small{color:var(--mut);font-weight:600}
.back{width:44px;height:44px;padding:0;border-radius:50%;background:#fff;border:1.5px solid var(--bd);color:var(--tx);box-shadow:none;font-size:1.6rem;line-height:1;flex:none}
.sh{font-weight:800;font-size:1.25rem;margin:22px 0 10px;letter-spacing:-.01em}
#code{font-size:1.3rem;font-weight:700;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.pc{position:relative;text-align:center;cursor:pointer;background:#fff;border:2px solid var(--bd);border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,box-shadow .15s}
.pc.sel{border-color:var(--acc);box-shadow:var(--sh);background:#fffaf8}
.pc .photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pc .ph{width:100%}
.pc .no{position:absolute;top:22px;left:22px;z-index:1;width:40px;height:40px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.15rem;border:3px solid #fff}
.pc .chk{position:absolute;top:22px;right:22px;z-index:1;width:40px;height:40px;border-radius:50%;background:var(--g);color:#fff;display:none;place-items:center;font-weight:800;border:3px solid #fff}
.pc.sel .chk{display:grid}
.pn{font-weight:800;font-size:1.1rem;line-height:1.25;min-height:2.5em;display:grid;place-items:center}
.dock{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:12px 12px 12px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:#fff;border:1px solid var(--bd);border-radius:99px;box-shadow:0 -8px 30px rgba(255,90,60,.12)}
.dock span{font-weight:700;color:var(--mut);min-width:0}
.cta{padding:16px 28px;font-size:1.02rem}
/* bilik: sukses */
.dn{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px;overflow:hidden}
.dn h1{color:var(--acc);font-size:clamp(1.5rem,6vw,2.2rem);line-height:1.2;margin:0}
.dn .who{font-weight:700;margin:0}.dn small{color:var(--mut)}
.dn .cta{width:100%;max-width:380px;padding:18px}
.conf{position:absolute;inset:0;pointer-events:none}
.conf i{position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;animation:fall 3.2s ease-in 1 both}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.conf{display:none}}
/* === layar hitung === */
.live{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(900px 420px at 100% -10%,var(--tint),transparent 70%),#fff;border-top:8px solid transparent;border-image:var(--g) 1;padding:2vh 3vw}
.hd{display:flex;align-items:center;justify-content:space-between;gap:2vw}
.hd h1{margin:0;text-align:center;flex:1}
.hl{display:flex;align-items:center;gap:1.2vw;flex:none}
.lv{display:inline-flex;align-items:center;gap:.55em;background:#fff;color:var(--tx);border:2px solid var(--bd);font-weight:800;letter-spacing:.06em;padding:.3em .9em;border-radius:99px}
.lv:before{content:"";display:inline-block;width:.7em;height:.7em;background:#e11d48;border-radius:50%;box-shadow:0 0 .6em rgba(225,29,72,.6);animation:rec 1.2s steps(1) infinite}
@keyframes rec{50%{opacity:0}}
.clk{font-weight:800;font-variant-numeric:tabular-nums;color:var(--mut)}
.cols{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2vw;margin:2.5vh 0}
.cols .cell:nth-child(1) .col{--cf:var(--g)}
.col{background:#fff;border-radius:32px;padding:2.5vh 1.5vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;border:2px solid var(--bd);box-shadow:var(--sh);position:relative;overflow:hidden}
.col.lead{border-color:var(--acc);box-shadow:0 14px 50px rgba(255,90,60,.28)}
.col .big{position:absolute;left:50%;top:-4vh;transform:translateX(-50%);font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:3px rgba(255,90,60,.14);pointer-events:none}
.col>*{position:relative}.col>.big{position:absolute}
.col .nm{font-weight:800;line-height:1.1;text-align:center;letter-spacing:-.02em}
.pct{font-weight:800;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--cc)}
.col .bar{width:80%;height:clamp(12px,2vh,22px);background:#f5ede9;border-radius:99px;overflow:hidden}
.col .bar i{display:block;height:100%;border-radius:99px;background:var(--cf,var(--cc));transition:width .8s ease}
.cn{color:var(--mut);font-weight:700}
.tag{position:absolute!important;top:14px;right:14px;background:var(--g);color:#fff;font-weight:800;padding:.3em .9em;border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--soft);border-radius:26px;text-align:center;border:1px solid var(--bd)}
.stats>div+div{border-left:1px solid var(--bd)}
.stats b{display:block;font-weight:800;font-variant-numeric:tabular-nums}
.stats>div:nth-child(n+3) b{color:var(--acc)}
.stats span{color:var(--mut);font-weight:700}
.pill{display:inline-block;padding:.3em 1em;border-radius:99px;font-weight:800;background:#e8f6ed;color:var(--ok)}.pill.off{background:#fdecee;color:var(--bad)}
/* ukuran layar hitung mengikuti layar */
body.fsmode nav{display:none!important}
body.fsmode .live{height:100vh;height:100dvh;overflow:hidden}
.live .logo{width:min(7vw,11vh);height:min(7vw,11vh)}
.live .hd h1{font-size:min(2.6vw,4.4vh)}.live .lv{font-size:min(1.5vw,2.8vh)}.live .clk{font-size:min(2.2vw,4vh)}
.live .cols{min-height:0}.live .col{min-height:0;padding:1.5vh 1.5vw;gap:1vh}
.live .ph{width:auto;height:min(26vh,36vw);aspect-ratio:3/4}
.live .nm{font-size:min(5vw,2.8vh)}.live .pct{font-size:min(14vw,10vh)}.live .cn{font-size:min(4vw,2.4vh)}
.live .badge{font-size:min(1.2vw,2.2vh)}.live .big{font-size:min(32vw,50vh)}.live .tag{font-size:min(1.2vw,2.2vh)}
.live .stats{padding:1.2vh 1vw}.live .stats b{font-size:min(4vw,7vh)}.live .stats span{font-size:min(1.3vw,2.2vh)}
.live .pill{margin-top:1vh;font-size:min(1.4vw,2.4vh)}
@media (min-aspect-ratio:1/1){.live .cols{grid-template-columns:repeat(var(--n,2),minmax(0,1fr))}}
/* susunan calon: foto di kiri, informasi di kanan */
.inf{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1vh;min-width:0}
.col .inf .bar{width:100%}
/* header layar & warna persen */
.hd h1{text-align:left;flex:1;min-width:0;line-height:1.15}
.hl{flex:1;min-width:0}
.hr{display:flex;align-items:center;gap:1.2vw;flex:none}
.pct,.live .pct{color:#ff6a13}
/* tombol layar penuh di bilik */
.fsb{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:30;width:44px;height:44px;padding:0;border-radius:50%;background:rgba(255,255,255,.94);color:var(--tx);border:1px solid var(--bd);box-shadow:0 4px 14px rgba(0,0,0,.14);display:grid;place-items:center}
/* responsif smartphone */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
img{max-width:100%}
input,textarea{font-size:16px}
input[type=file]{font-size:.85rem;max-width:100%}
@media (max-width:600px){
 nav{padding:6px 8px;gap:2px}
 nav a{padding:8px 10px;font-size:.82rem}
 main{padding:14px 12px}
 h1{font-size:1.35rem}
 .card{padding:14px;border-radius:20px}
 .row>button{flex:1 1 auto}
 .vt{padding:0 14px 16px}
 .vh{padding-right:52px}
 .dock{padding-left:14px;gap:8px}
 .dock .cta{padding:14px 20px}
 .home .pill-w{padding:16px}
 .dn .cta{padding:16px}
}
@media (max-aspect-ratio:1/1){
 .live{padding:1.5vh 4vw}
 .hd{flex-wrap:wrap;gap:8px}
 .hl{flex:1 1 100%;gap:10px}
 .hr{width:100%;justify-content:space-between}
 .live .logo{width:48px;height:48px}
 .live .hd h1{font-size:1.1rem}
 .live .lv{font-size:.78rem}
 .live .clk{font-size:1.05rem}
 .live .badge,.live .tag{font-size:.75rem}
 .live .col{padding:16px}
 .live .stats{grid-template-columns:1fr 1fr;padding:6px}
 .live .stats>div{padding:8px 4px}
 .live .stats>div+div{border-left:0}
 .live .stats>div:nth-child(even){border-left:1px solid var(--bd)}
 .live .stats>div:nth-child(n+3){border-top:1px solid var(--bd)}
 .live .stats b{font-size:1.5rem}
 .live .stats span{font-size:.72rem}
 .live .pill{font-size:.8rem}
}
/* tombol visi-misi & lembar rincian */
.vm{align-self:center;background:var(--tint);color:var(--acc);box-shadow:none;padding:9px 16px;font-size:.88rem}
.sbg{position:fixed;inset:0;z-index:40;background:rgba(20,10,5,.5);display:flex;align-items:flex-end;justify-content:center}
.shs{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sbg{align-items:center}.shs{border-radius:28px}}
.shs h3{margin:0 0 4px;font-size:1.25rem}
.shs h4{margin:16px 0 6px;color:var(--acc);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
.shs p,.shs li{line-height:1.55;margin:0 0 4px}.shs ol{padding-left:20px;margin:0}
.hb .tg{margin:0 0 18px;font-size:1.1rem;opacity:.95}
/* panel panitia */
.adm{max-width:860px;margin:0 auto;padding:16px 14px 110px}
.ah{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.ah h1{margin:0}
.atl{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.at{background:var(--soft);border:1px solid var(--bd);border-radius:18px;padding:12px 8px;text-align:center}
.at b{display:block;font-size:1.5rem;font-weight:800;color:var(--acc)}.at span{font-size:.74rem;color:var(--mut);font-weight:700}
.atabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:99px;margin-bottom:14px;overflow-x:auto}
.ab{flex:1;white-space:nowrap;background:transparent;color:var(--mut);box-shadow:none;padding:10px 14px}
.ab.on{background:#fff;color:var(--acc);box-shadow:0 2px 10px rgba(255,90,60,.2)}
.card h2{margin:0 0 6px;font-size:1.1rem}
.fl{display:block;font-weight:700;font-size:.82rem;color:var(--mut);margin:12px 0 6px}
.g2{display:grid;grid-template-columns:90px 1fr;gap:10px}
.ph2{display:flex;align-items:center;gap:10px}.ph2 b{flex:1;font-size:1.05rem}
.no2{width:34px;height:34px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800}
.ups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed #f3c9bb;border-radius:18px;padding:10px;cursor:pointer;background:#fffaf8}
.up img,.up .pl{width:100%;max-width:110px;aspect-ratio:3/4;object-fit:cover;border-radius:12px}
.up .pl{display:grid;place-items:center;font-size:2rem;color:var(--acc);background:var(--tint)}
.up small{font-weight:700;color:var(--mut);text-align:center}
.btn{display:inline-block;padding:10px 18px;border-radius:99px;border:1.5px solid var(--bd);font-weight:800;cursor:pointer;background:#fff}
.sm{padding:8px 14px;font-size:.85rem}
.add{width:100%;border-style:dashed;padding:16px}
.lk{display:flex;gap:8px;align-items:center}.lk input{flex:1;font-size:.85rem;min-width:0}
.dz{border-color:#f6c6cb;background:#fffafa}
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.96);border-top:1px solid var(--bd)}
.sbar button{width:100%;max-width:420px;padding:15px}
@media (max-width:600px){.atl{grid-template-columns:1fr 1fr}.g2{grid-template-columns:76px 1fr}}
/* perbaikan: isi kartu paslon tidak terpotong di HP */
.gchip{display:inline-block;margin-top:10px;background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.75);padding:8px 18px;border-radius:99px;font-weight:800}
@media (max-aspect-ratio:1/1){
 .live .cols{flex:0 0 auto;min-height:auto;grid-template-columns:1fr;align-content:start;margin:2vh 0}
 .live .col{min-height:auto;justify-content:flex-start}
 .live .ph{max-width:48%}
 body.fsmode .live{height:auto;min-height:100dvh;overflow:visible}
}
@media (max-height:520px){
 body.fsmode .live{height:auto;min-height:100dvh;overflow:visible}
 .live .cols{flex:0 0 auto}
}
/* tata letak cerdas: menyesuaikan lebar kartu (container query) */
.cell{container-type:inline-size;display:flex;min-width:0}
.cell>.col{flex:1;min-width:0}
.live{--k:1}.live.t1{--k:.82}.live.t2{--k:.66}
.live .col{--ph:min(36vh,60cqw);gap:calc(1vh*var(--k));align-items:center;justify-content:center}
.live .col .ph{height:calc(var(--ph)*var(--k));width:auto;aspect-ratio:3/4;max-width:48%}
.live .col .inf{width:100%;align-items:center;text-align:center}
.live .col .inf .bar{width:84%}
.live .col .nm{font-size:calc(min(3.8cqw,3vh)*var(--k));text-align:center}
.live .col .pct{font-size:calc(min(15cqw,9.5vh)*var(--k))}
.live .col .cn{font-size:calc(min(3.6cqw,2.6vh)*var(--k))}
.live .col .badge,.live .col .tag{font-size:calc(min(3cqw,2.2vh)*var(--k))}
.live .col .big{left:50%;right:auto;transform:translateX(-50%);top:-3vh;font-size:min(60cqw,42vh)}
@container (min-width:640px){
 .live .cols:not(.many) .col{--ph:min(46vh,32cqw);flex-direction:row;justify-content:flex-start;gap:3cqw;padding:2.5vh 3cqw}
 .live .cols:not(.many) .col .ph{max-width:none}
 .live .cols:not(.many) .col .inf{flex:1;width:auto;align-items:flex-start;text-align:left}
 .live .cols:not(.many) .col .inf .bar{width:100%}
 .live .cols:not(.many) .col .nm{text-align:left;font-size:calc(min(3.2cqw,2.8vh)*var(--k))}
 .live .cols:not(.many) .col .pct{font-size:calc(min(14cqw,11vh)*var(--k))}
 .live .cols:not(.many) .col .cn{font-size:calc(min(2.8cqw,2.6vh)*var(--k))}
 .live .cols:not(.many) .col .badge{font-size:calc(min(2.4cqw,2vh)*var(--k))}
 .live .cols:not(.many) .col .big{left:auto;right:2cqw;transform:none;font-size:min(36cqw,42vh)}
}
/* penanda pilihan: hijau agar berbeda dari tema oranye */
.pc.sel{border-color:#16a34a;background:#f3fbf6;box-shadow:0 8px 28px rgba(22,163,74,.22)}
.pc .chk{background:#16a34a;font-size:1.3rem;box-shadow:0 4px 12px rgba(22,163,74,.4)}
.grid:has(.pc.sel) .pc:not(.sel){opacity:.6}
.dock b{color:#15803d}
/* hiasan layar hitung */
.live{position:relative;overflow:hidden;background:linear-gradient(165deg,#fff 0%,#fff8f3 48%,#ffe9dd 100%)}
.live>:not(.orn){position:relative;z-index:1}
.orn{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orn i{position:absolute;display:block}
.o1{width:46vw;height:46vw;right:-14vw;top:-20vw;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,122,47,.30),rgba(255,61,90,.16) 55%,transparent 70%);animation:drift 22s ease-in-out infinite alternate}
.o2{width:42vw;height:42vw;left:-12vw;bottom:-18vw;border-radius:50%;background:radial-gradient(circle,rgba(255,150,70,.24),transparent 68%);animation:drift 26s ease-in-out infinite alternate-reverse}
.o3{width:10vw;height:10vw;right:7vw;bottom:15vh;border-radius:50%;border:2px solid rgba(255,90,60,.2);box-shadow:0 0 0 1.2vw rgba(255,90,60,.05)}
.dt{width:12vw;height:8vw;background-image:radial-gradient(rgba(255,90,60,.38) 1.6px,transparent 1.9px);background-size:14px 14px}
.d1{left:2.5vw;top:15vh}.d2{right:3.5vw;bottom:20vh}
.ln{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:rgba(255,90,60,.17);stroke-width:1.4}

.wv{position:absolute;left:0;right:0;bottom:0;width:100%;height:24vh;opacity:.13}
@keyframes drift{to{transform:translate(1.6vw,1.2vh)}}
@media (prefers-reduced-motion:reduce){.o1,.o2{animation:none}}
.live img.logo{background:#fff;border-radius:50%;padding:.5vh;box-shadow:0 6px 18px rgba(255,90,60,.28)}
.hd h1::after{content:"";display:block;width:clamp(60px,6vw,120px);height:6px;border-radius:99px;background:var(--g);margin-top:.3em}
.live .clk{background:#fff;color:var(--tx);padding:.15em .65em;border-radius:99px;border:2px solid rgba(255,140,90,.28);box-shadow:0 4px 14px rgba(255,90,60,.12)}
.live .lv{box-shadow:0 4px 14px rgba(255,90,60,.12);border-color:rgba(255,140,90,.28)}
.live .col{background:linear-gradient(180deg,#fff 0%,#fffaf7 100%);border:2px solid rgba(255,140,90,.26);box-shadow:0 14px 40px rgba(255,90,60,.12),0 2px 6px rgba(120,60,20,.06)}
.live .col::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--g)}
.live .col.lead{border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,90,60,.12),0 18px 60px rgba(255,90,60,.35)}
.live .stats{background:linear-gradient(135deg,#fff 0%,#fff1e8 100%);border:2px solid rgba(255,140,90,.26);box-shadow:0 10px 30px rgba(255,90,60,.12)}
.live .col .bar i{box-shadow:0 0 12px rgba(255,90,60,.35)}
.acc{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--bd)}
.acc .grow{flex:1;min-width:0;overflow-wrap:anywhere}.acc b{display:block}.acc small{color:var(--mut)}
</style>

  <a data-t="layar">📺 Layar Hitung</a><a data-t="bilik">🗳️ Bilik Suara</a><a data-t="bilikguru">👩‍🏫 Bilik Guru</a><a data-t="admin">⚙️ Panel Panitia</a>

</nav>
<div id="app"></div>

<script>
/* === ISI DENGAN KONFIGURASI FIREBASE ANDA (lihat PANDUAN.md) === */
const FB={apiKey:"AIzaSyDjlQYqbbE_gZMI9NtODM57Q0BQRXP5-d0",authDomain:"pemilu-osis-smknedas.firebaseapp.com",databaseURL:"https://pemilu-osis-smknedas-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"pemilu-osis-smknedas",appId:"1:737953067618:web:374ba0270b9f1f5a58973b"};
/* ============================================================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=s=>String(s).trim().toLowerCase().replace(/[^a-z0-9_-]/g,'_');
const kh=location.hash.slice(1),kiosk=kh==='bilik'||kh==='bilikguru';
let db,auth,me=null,role=null,ready=false,tab=kiosk?kh:(kh||'layar');
let cfg={title:'Pemilihan Ketua & Wakil Ketua OSIS',school:'SMK Negeri 2 Sukorejo',logo:'',candidates:[],open:true};
let tally={},stats={total:0,voted:0},sel=null,flash=null,voter=null,info=null;
const typing=()=>document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
function setTab(t){if(kiosk)return;tab=t;try{history.replaceState(null,'','#'+t)}catch(e){};render()}
document.querySelectorAll('nav a[data-t]').forEach(a=>a.onclick=()=>setTab(a.dataset.t));
const setFs=on=>document.body.classList.toggle('fsmode',on);
function toggleFs(){const on=!document.body.classList.contains('fsmode');setFs(on);try{const p=on?document.documentElement.requestFullscreen():(document.fullscreenElement&&document.exitFullscreen());p&&p.catch&&p.catch(()=>{})}catch(e){}}
$('#fs').onclick=toggleFs;
document.addEventListener('click',e=>{if(e.target.closest('.fsb'))toggleFs()});
const FSB=()=>'<button class="fsb" aria-label="Layar penuh" title="Layar penuh"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>';
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)setFs(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')setFs(false)});
document.addEventListener('dblclick',()=>{if(document.body.classList.contains('fsmode')&&tab==='layar'){setFs(false);try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}});
window.addEventListener('hashchange',()=>{if(kiosk)return;tab=location.hash.slice(1)||'layar';render()});
document.addEventListener('dblclick',()=>{if(tab==='layar'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}});
const logo=()=>cfg.logo?`<img class="logo" alt="Logo" src="${esc(cfg.logo)}">`:'<span class="logo fb">SMKN<br>2</span>';
const brand=()=>`<div class="brand">${logo()}<div><b>${esc(cfg.school)}</b><small>Panitia OSIS</small></div></div>`;
const photos=k=>`<div class="photos"><img class="ph" alt="" src="${esc(k.photoK||'')}" onerror="this.removeAttribute('src')"><img class="ph" alt="" src="${esc(k.photoW||'')}" onerror="this.removeAttribute('src')"></div>`;
const shrink=(f,m,t)=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const r=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*r;c.height=i.height*r;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL(t,.82))};i.onerror=no;i.src=URL.createObjectURL(f)});

function render(){
  document.querySelector('nav').style.display=kiosk?'none':'';
  $('#fs').style.display=tab==='layar'?'':'none';
  document.querySelectorAll('nav a[data-t]').forEach(a=>a.classList.toggle('on',a.dataset.t===tab));
  const app=$('#app');
  if(!db){app.innerHTML='<main><div class="card"><b>Firebase belum dikonfigurasi.</b><p class="sub">Isi objek <code>FB</code> di bagian atas berkas ini. Ikuti langkah di PANDUAN.md.</p></div></main>';return}
  if(!ready){app.innerHTML='<main><p class="sub">Menghubungkan…</p></main>';return}
  if(tab==='bilik'||tab==='bilikguru'||tab==='admin'){
    if(!me)return loginForm(app);
    if(role!=='admin'&&!(role==='booth'&&tab!=='admin'))return noAccess(app);
    return tab==='admin'?renderAdmin(app):renderBilik(app);
  }
  renderLive(app);
}
function loginForm(app){
  app.innerHTML=`<main><div class="card" style="max-width:420px;margin:8vh auto"><h1>Masuk petugas</h1><p class="sub">${tab!=='admin'?'Login perangkat bilik (dilakukan sekali oleh panitia).':'Login panitia.'}</p>
  <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Kata sandi" style="margin-top:8px"><div class="row" style="margin-top:12px"><button id="lg">Masuk</button></div>
  ${flash?`<div class="msg ${flash.t}">${esc(flash.m)}</div>`:''}</div></main>`;
  $('#lg').onclick=async()=>{try{await auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value);flash=null}catch(e){flash={t:'er',m:'Email atau kata sandi salah.'};render()}};
}
function noAccess(app){
  app.innerHTML=`<main><div class="card" style="max-width:480px;margin:8vh auto"><h1>Akses ditolak</h1><p class="sub">Akun ini belum terdaftar sebagai ${tab==='admin'?'panitia':'perangkat bilik atau panitia'}.</p><button id="out">Keluar</button></div></main>`;
  $('#out').onclick=()=>auth.signOut();
}

function renderLive(app){
  const tot=Object.values(tally).reduce((a,b)=>a+b,0),mx=Math.max(0,...cfg.candidates.map(k=>tally[slug(k.no)]||0));
  const lead=cfg.candidates.filter(k=>(tally[slug(k.no)]||0)===mx&&mx>0).length===1;
  const cols=cfg.candidates.map((k,i)=>{const n=tally[slug(k.no)]||0,p=tot?Math.round(n/tot*100):0,ld=lead&&n===mx;
    return `<div class="cell"><div class="col ${ld?'lead':''}" style="--cc:var(--c${i%2+1})"><span class="big">${esc(k.no)}</span>${ld?'<span class="tag">Unggul</span>':''}${photos(k)}<div class="inf"><span class="badge">Nomor Urut ${esc(k.no)}</span><div class="nm">${esc(k.name)}</div>
    <div class="pct">${p}%</div><div class="bar"><i style="width:${p}%"></i></div><div class="cn">${n} suara</div></div></div></div>`}).join('');
  const dpt=stats.total||0,v=stats.voted||0;
  app.innerHTML=`<div class="live">${ORN}<div class="hd"><div class="hl">${logo()}<h1>${esc(cfg.title)}</h1></div><div class="hr"><span class="lv">LIVE COUNTING</span><span class="clk" id="clk"></span></div></div>
  <div class="cols${cfg.candidates.length>2?' many':''}" style="--n:${Math.min(cfg.candidates.length||1,4)}">${cols||'<div class="col">Belum ada paslon. Atur di Panel Panitia.</div>'}</div>
  <div class="stats"><div><b>${dpt||'–'}</b><span>Total pemilih</span></div><div><b>${dpt?Math.max(0,dpt-v):'–'}</b><span>Belum memilih</span></div><div><b>${v}</b><span>Sudah memilih</span></div><div><b>${dpt?(v/dpt*100).toFixed(1)+'%':'–'}</b><span>Partisipasi</span></div></div>
  <div style="text-align:center"><span class="pill ${cfg.open?'':'off'}">${cfg.open?'Pemilihan masih aktif':'Pemilihan ditutup'}${(stats.guru||cfg.guruTotal)?' · Suara guru: '+(stats.guru||0)+(cfg.guruTotal?' / '+cfg.guruTotal:''):''}</span></div></div>`;
  tick();fitLive();
}
let rz;
function fitLive(){const L=$('.live');if(!L)return;L.classList.remove('t1','t2');
  const bad=()=>[...L.querySelectorAll('.col')].some(c=>{const r=c.getBoundingClientRect(),k=[...c.children].filter(x=>!/big|tag/.test(x.className));if(!k.length)return false;
    const q=k.map(x=>x.getBoundingClientRect());return Math.min(...q.map(x=>x.top))<r.top-1||Math.max(...q.map(x=>x.bottom))>r.bottom+1||Math.max(...q.map(x=>x.right))>r.right+1||Math.min(...q.map(x=>x.left))<r.left-1});
  for(const c of['t1','t2']){if(!bad())break;L.classList.add(c)}}
window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(fitLive,150)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitLive);
function tick(){const e=$('#clk');if(e)e.textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).replace(/\./g,':')}
setInterval(tick,1000);

let tm;
function lookup(){clearTimeout(tm);const id=slug($('#code').value);info=null;showWho();if(!id)return;
  tm=setTimeout(async()=>{try{const[v,d]=await Promise.all([db.ref('voters/'+id).get(),db.ref('voted/'+id).get()]);if(slug($('#code').value)!==id)return;
    info={id,found:v.exists(),n:(v.val()||{}).n,k:(v.val()||{}).k,done:d.exists()};showWho()}catch(e){}},300)}
function showWho(){const w=$('#who');if(!w)return;if(!info){w.innerHTML='';return}
  const l=esc(info.n||info.id)+(info.k?' · Kelas '+esc(info.k):'');
  w.innerHTML=!info.found?'<div class="msg er">NIS tidak ditemukan di daftar pemilih</div>':info.done?`<div class="msg er">⚠ ${l} sudah menggunakan hak pilihnya.</div>`:`<div class="msg ok">✓ ${l}</div>`}

const ORN='<div class="orn" aria-hidden="true"><i class="o1"></i><i class="o2"></i><i class="o3"></i><i class="dt d1"></i><i class="dt d2"></i><svg class="ln" viewBox="0 0 1440 900" preserveAspectRatio="none"><path d="M-20 180C220 90 420 250 700 170S1200 60 1460 150"/><path d="M-20 330C240 240 460 400 740 320S1220 210 1460 300"/><path d="M-20 690C260 600 520 780 820 700S1240 600 1460 680"/></svg><svg class="wv" viewBox="0 0 1440 220" preserveAspectRatio="none"><defs><linearGradient id="wg" x1="0" x2="1"><stop offset="0" stop-color="#ff7a2f"/><stop offset="1" stop-color="#ff3d5a"/></linearGradient></defs><path fill="url(#wg)" d="M0 120C240 40 480 200 760 120S1200 40 1440 110V220H0Z"/></svg></div>';
const CONT='<svg class="cont" viewBox="0 0 400 800" preserveAspectRatio="none" aria-hidden="true"><path d="M-20 120C80 40 200 160 300 90S420 40 440 100"/><path d="M-30 260C90 180 180 320 320 230S430 200 450 260"/><path d="M-20 560C100 480 200 640 330 540S430 520 450 600"/><path d="M-30 700C80 640 220 760 340 680"/></svg>';
const BOX='<svg viewBox="0 0 200 200" width="190" height="190" aria-hidden="true"><circle cx="100" cy="100" r="92" fill="#ffe1e1"/><rect x="40" y="62" width="120" height="86" rx="6" fill="#fff" stroke="#ff5a5f" stroke-width="3"/><rect x="34" y="52" width="132" height="14" rx="4" fill="#ff5a5f"/><rect x="62" y="56" width="76" height="5" rx="2.5" fill="#fff"/><g font-family="Inter,sans-serif" font-weight="800" font-size="13" fill="#ff5a5f"><g transform="rotate(-12 80 98)"><rect x="62" y="80" width="40" height="30" rx="3" fill="#fff" stroke="#ff9a9a"/><text x="68" y="100">Vote</text></g><g transform="rotate(10 124 104)"><rect x="106" y="86" width="40" height="30" rx="3" fill="#fff" stroke="#ff9a9a"/><text x="112" y="106">Vote</text></g></g></svg>';
let vmOpen=null,scr='home',verr=null,doneInfo=null,doneTm;
function goHome(){clearTimeout(doneTm);vmOpen=null;scr='home';sel=null;voter=null;info=null;verr=null;render()}
function renderBilik(app){scr==='home'?bHome(app):scr==='done'?bDone(app):bVote(app)}
function bHome(app){
  app.innerHTML=`<div class="home">${CONT}${FSB()}<div class="hm">${logo()}<h1>${esc(cfg.title)}</h1>${tab==='bilikguru'?'<span class="gchip">Bilik Suara Guru</span>':''}</div>
  <div class="hb"><p class="tg">Gunakan hak pilihmu dengan Bijak!</p>${cfg.open?'<button class="pill-w" id="go">Mulai memilih</button>':'<div class="closed">Pemilihan sedang ditutup</div>'}<div class="sch">${esc(cfg.school)}</div></div></div>`;
  const g=$('#go');if(g)g.onclick=()=>{scr='vote';render()};
}
function bVote(app){
  const G=tab==='bilikguru',cur=cfg.candidates.find(k=>k.no===sel),vk=cfg.candidates.find(k=>k.no===vmOpen);
  const pc=cfg.candidates.map(k=>`<div class="pc ${sel===k.no?'sel':''}" data-no="${esc(k.no)}"><span class="no">${esc(k.no)}</span><span class="chk">✓</span>${photos(k)}<div class="pn">${esc(k.name)}</div>${(k.visi||k.misi)?`<button class="vm" type="button" data-vm="${esc(k.no)}">Lihat visi & misi</button>`:''}</div>`).join('');
  const li=t=>String(t).split('\n').map(x=>x.replace(/^\s*(\d+[.)]|[-•*])\s*/,'').trim()).filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('');
  const sheet=vk?`<div class="sbg" id="sbg"><div class="shs" role="dialog" aria-modal="true"><h3>Paslon ${esc(vk.no)}</h3><div class="sub">${esc(vk.name)}</div>${vk.visi?`<h4>Visi</h4><p>${esc(vk.visi)}</p>`:''}${vk.misi?`<h4>Misi</h4><ol>${li(vk.misi)}</ol>`:''}<div class="row" style="margin-top:18px"><button class="sec" id="vmx" style="flex:1">Tutup</button><button id="vmp" style="flex:1">Pilih paslon ${esc(vk.no)}</button></div></div></div>`:'';
  app.innerHTML=`<div class="vt">${FSB()}<div class="vh"><button class="back" id="bk" aria-label="Kembali">‹</button><div><b>${esc(cfg.title)}</b><small>${G?'Bilik Suara Guru':esc(cfg.school)}</small></div></div>
  ${verr?`<div class="msg er" id="fl">${esc(verr)}</div>`:''}
  ${G?'':`<div class="sh">Masukkan NIS</div><input id="code" autocomplete="off" inputmode="numeric" placeholder="Contoh: 12345" value="${esc(voter||'')}"><div id="who"></div>`}
  <div class="sh">Pilih paslon</div><div class="grid">${pc||'<span class="sub">Belum ada paslon.</span>'}</div>
  <div class="dock"><span>${cur?'Pilihanmu: <b>Paslon '+esc(cur.no)+'</b>':'Belum memilih'}</span><button class="cta" id="send" ${sel?'':'disabled'}>Kirim suara</button></div></div>${sheet}`;
  const keep=()=>{const c=$('#code');if(c)voter=c.value};
  $('#bk').onclick=goHome;
  app.querySelectorAll('.pc').forEach(e=>e.onclick=ev=>{if(ev.target.closest('.vm'))return;keep();sel=e.dataset.no;verr=null;bVote(app)});
  app.querySelectorAll('.vm').forEach(b=>b.onclick=()=>{keep();vmOpen=b.dataset.vm;bVote(app)});
  if(vk){$('#vmx').onclick=()=>{vmOpen=null;bVote(app)};$('#sbg').onclick=e=>{if(e.target.id==='sbg'){vmOpen=null;bVote(app)}};$('#vmp').onclick=()=>{sel=vmOpen;vmOpen=null;verr=null;bVote(app)}}
  $('#send').onclick=G?submitGuru:submit;
  const ci=$('#code');if(ci){ci.oninput=lookup;showWho()}
  const f=$('#fl');if(f)f.scrollIntoView({block:'center'});
}
function bDone(app){
  const c=Array.from({length:30},(_,i)=>`<i style="left:${(i*37+7)%100}%;animation-delay:${(i%10)*.15}s;background:${['#ff3d5a','#ff7a2f','#ffb199'][i%3]}"></i>`).join('');
  app.innerHTML=`<div class="dn">${FSB()}<div class="conf">${c}</div><h1>Terima kasih!<br>Suaramu berhasil terkirim.</h1>${BOX}<p class="who">${doneInfo&&doneInfo.guru?'Suara guru tercatat':esc((doneInfo&&doneInfo.n)||'')+(doneInfo&&doneInfo.k?' · '+esc(doneInfo.k):'')}</p><button class="cta" id="hm">Kembali ke beranda</button><small>Kembali otomatis dalam beberapa detik</small></div>`;
  $('#hm').onclick=goHome;
}
async function submitGuru(){
  const app=$('#app');
  if(!sel){verr='Pilih salah satu paslon.';return bVote(app)}
  if(cfg.guruTotal>0&&(stats.guru||0)>=cfg.guruTotal){verr='Kuota suara guru sudah terpenuhi.';return bVote(app)}
  const b=$('#send');if(b)b.disabled=true;
  const S=firebase.database.ServerValue,up={};up['tally/'+slug(sel)]=S.increment(1);up['stats/guru']=S.increment(1);
  try{await db.ref().update(up);doneInfo={guru:true};sel=null;verr=null;scr='done';render();doneTm=setTimeout(goHome,9000)}
  catch(e){verr='Gagal mengirim: '+e.message;bVote(app)}
}
async function submit(){
  const id=slug($('#code').value);voter=$('#code').value;const app=$('#app');
  if(!info||info.id!==id||!info.found){verr='NIS tidak terdaftar. Periksa kembali.';return bVote(app)}
  if(info.done){verr='NIS ini sudah menggunakan hak pilihnya.';return bVote(app)}
  const S=firebase.database.ServerValue,up={};up['voted/'+id]=S.TIMESTAMP;up['tally/'+slug(sel)]=S.increment(1);up['stats/voted']=S.increment(1);
  try{await db.ref().update(up);doneInfo={n:info.n,k:info.k};sel=null;voter=null;info=null;verr=null;scr='done';render();doneTm=setTimeout(goHome,9000)}
  catch(e){verr=e.code==='PERMISSION_DENIED'?'Suara ditolak: NIS sudah dipakai atau akses tidak sah.':'Gagal mengirim: '+e.message;bVote(app)}
}
let bi={},bform={n:'',e:'',p:''},biOn=false;
async function makeBooth(name,email,pw){
  const ap=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FB,'sec'),a2=ap.auth();let uid;
  try{uid=(await a2.createUserWithEmailAndPassword(email,pw)).user.uid}
  catch(e){
    if(e.code==='auth/email-already-in-use'){try{uid=(await a2.signInWithEmailAndPassword(email,pw)).user.uid}catch(x){throw new Error('Email sudah terdaftar dengan kata sandi lain.')}}
    else if(e.code==='auth/weak-password')throw new Error('Kata sandi terlalu lemah (minimal 6 karakter).');
    else if(e.code==='auth/invalid-email')throw new Error('Format email tidak valid.');
    else throw e}
  await a2.signOut();
  await db.ref().update({['booths/'+uid]:true,['boothInfo/'+uid]:{name,email,ts:firebase.database.ServerValue.TIMESTAMP}});
}
let atab='umum';
function renderAdmin(app){
  const C=cfg.candidates,tot=stats.total||0,v=stats.voted||0,base=location.href.split('#')[0];
  const tile=(l,x)=>`<div class="at"><b>${x}</b><span>${l}</span></div>`;
  const tabs=[['umum','Umum'],['paslon','Paslon'],['siswa','Data siswa'],['akun','Akun bilik'],['kontrol','Kontrol']].map(([k,l])=>`<button class="ab ${atab===k?'on':''}" data-at="${k}">${l}</button>`).join('');
  const photo=(f,i,l)=>`<label class="up"><input type="file" accept="image/*" data-up="${f}" data-i="${i}" hidden>${C[i][f]?`<img src="${esc(C[i][f])}" alt="">`:'<span class="pl">+</span>'}<small>Foto ${l} · ${C[i][f]?'ganti':'unggah'}</small></label>`;
  const link=(l,u)=>`<label class="fl">${l}</label><div class="lk"><input readonly value="${esc(u)}"><button class="sec sm" data-copy="${esc(u)}">Salin</button></div>`;
  let body='';
  if(atab==='umum')body=`<div class="card"><h2>Identitas pemilihan</h2><label class="fl">Judul pemilihan</label><input id="ttl" value="${esc(cfg.title)}"><label class="fl">Nama sekolah</label><input id="sch" value="${esc(cfg.school)}"><label class="fl">Jumlah guru (opsional, membatasi suara guru)</label><input id="gt" inputmode="numeric" value="${cfg.guruTotal||''}" placeholder="Contoh: 40"><label class="fl">Logo sekolah</label><div class="row">${logo()}<label class="btn">Ganti logo<input type="file" id="lg" accept="image/*" hidden></label></div></div>`;
  if(atab==='paslon')body=C.map((k,i)=>`<div class="card"><div class="ph2"><span class="no2">${esc(k.no)}</span><b>Paslon ${esc(k.no)}</b><button class="sec sm" data-del="${i}">Hapus</button></div>
    <div class="g2"><div><label class="fl">No. urut</label><input data-f="no" data-i="${i}" value="${esc(k.no)}" inputmode="numeric"></div><div><label class="fl">Nama ketua &amp; wakil</label><input data-f="name" data-i="${i}" value="${esc(k.name)}"></div></div>
    <label class="fl">Foto</label><div class="ups">${photo('photoK',i,'ketua')}${photo('photoW',i,'wakil')}</div>
    <label class="fl">Visi</label><textarea rows="3" data-f="visi" data-i="${i}">${esc(k.visi||'')}</textarea>
    <label class="fl">Misi <span class="sub">(satu poin per baris)</span></label><textarea rows="5" data-f="misi" data-i="${i}">${esc(k.misi||'')}</textarea></div>`).join('')+'<button class="sec add" id="add">+ Tambah paslon</button>';
  if(atab==='siswa')body=`<div class="card"><h2>Data siswa</h2><p class="sub" style="margin:0 0 8px">Satu siswa per baris dengan format <code>NIS,Nama,Kelas</code>. Bisa impor CSV atau tempel dari Excel.</p>
    <label class="btn">Impor file CSV<input type="file" id="csv" accept=".csv,.txt" hidden></label>
    <textarea id="vt" rows="8" placeholder="NIS,Nama,Kelas&#10;12345,Andi Pratama,XI RPL 1" style="margin-top:10px"></textarea>
    <div class="row" style="margin-top:10px"><button id="imp">Simpan data siswa</button><span class="sub">Tersimpan: ${tot} siswa</span></div></div>`;
  if(atab==='kontrol')body=`<div class="card"><h2>Status pemilihan</h2><p class="sub" style="margin:0 0 10px">Saat ini: <b style="color:${cfg.open?'var(--ok)':'var(--bad)'}">${cfg.open?'DIBUKA':'DITUTUP'}</b></p><button id="tog" class="${cfg.open?'sec':''}">${cfg.open?'Tutup pemilihan':'Buka pemilihan'}</button></div>
    <div class="card"><h2>Tautan</h2>${link('Layar hitung (projector)',base)}${link('Bilik suara siswa (HP bilik)',base+'#bilik')}${link('Bilik suara guru',base+'#bilikguru')}</div>
    <div class="card dz"><h2>Zona berbahaya</h2><p class="sub" style="margin:0 0 10px">Menghapus semua suara dan status memilih. Lakukan setelah uji coba, sebelum hari pemilihan.</p><button class="dan" id="rst">Reset semua suara</button></div>`;
  if(atab==='akun')body=`<div class="card"><h2>Buat akun bilik</h2><p class="sub" style="margin:0 0 4px">Akun ini dipakai untuk login di HP bilik siswa dan bilik guru. Email boleh berupa alamat karangan, misalnya <code>bilik1@osis.sch</code>.</p>
    <label class="fl">Nama bilik</label><input id="bn" value="${esc(bform.n)}" placeholder="Contoh: Bilik 1">
    <label class="fl">Email</label><input id="be" type="email" autocapitalize="off" value="${esc(bform.e)}" placeholder="bilik1@osis.sch">
    <label class="fl">Kata sandi (minimal 6 karakter)</label><div class="lk"><input id="bp" autocomplete="off" value="${esc(bform.p)}"><button class="sec sm" id="bg" type="button">Acak</button></div>
    <div class="row" style="margin-top:14px"><button id="bc">Buat akun</button></div></div>
    <div class="card"><h2>Akun bilik terdaftar</h2>${Object.entries(bi).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0)).map(([u,x])=>`<div class="acc"><div class="grow"><b>${esc(x.name)}</b><small>${esc(x.email)}</small></div><button class="dan sm" data-rv="${esc(u)}">Cabut akses</button></div>`).join('')||'<p class="sub" style="margin:8px 0 0">Belum ada akun yang dibuat dari panel ini.</p>'}</div>`;
  app.innerHTML=`<div class="adm"><div class="ah"><div><h1>Panel Panitia</h1><div class="sub">${esc(cfg.school)}</div></div><button class="sec sm" id="out">Keluar</button></div>
  <div class="atl">${tile('Siswa',tot)}${tile('Sudah memilih',v)}${tile('Belum memilih',Math.max(0,tot-v))}${tile('Total suara',Object.values(tally).reduce((a,b)=>a+b,0))}</div>
  <div class="atabs">${tabs}</div>${flash?`<div class="msg ${flash.t}" style="margin:0 0 12px">${esc(flash.m)}</div>`:''}${body}
  ${(atab==='umum'||atab==='paslon')?'<div class="sbar"><button id="save">Simpan perubahan</button></div>':''}</div>`;
  const read=()=>{const t=$('#ttl');if(t)cfg.title=t.value;const sc=$('#sch');if(sc)cfg.school=sc.value;const gt=$('#gt');if(gt)cfg.guruTotal=parseInt(gt.value)||0;const bn=$('#bn');if(bn)bform={n:bn.value,e:$('#be').value,p:$('#bp').value};app.querySelectorAll('[data-f]').forEach(e=>{if(cfg.candidates[e.dataset.i])cfg.candidates[e.dataset.i][e.dataset.f]=e.value})};
  app.oninput=read;
  const run=async(fn,ok)=>{try{await fn();flash={t:'ok',m:ok}}catch(e){flash={t:'er',m:'Gagal: '+(e.message||e.code)}}renderAdmin(app)};
  const saveCfg=m=>run(()=>db.ref('config').set(cfg),m);
  const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
  app.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>{read();flash=null;atab=b.dataset.at;renderAdmin(app)});
  app.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{try{navigator.clipboard.writeText(b.dataset.copy);b.textContent='Tersalin ✓'}catch(e){}});
  on('#out',()=>auth.signOut());
  on('#bg',()=>{const c='abcdefghjkmnpqrstuvwxyz23456789';let p='';for(let i=0;i<10;i++)p+=c[Math.floor(Math.random()*c.length)];$('#bp').value=p;read()});
  on('#bc',()=>{read();const{n,e,p}=bform;if(!n.trim()||!e.trim()||p.length<6){flash={t:'er',m:'Isi nama, email, dan kata sandi (minimal 6 karakter).'};return renderAdmin(app)}
    run(async()=>{await makeBooth(n.trim(),e.trim(),p);bform={n:'',e:'',p:''}},'Akun bilik dibuat. Catat email dan kata sandinya.')});
  app.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>{if(!confirm('Cabut akses akun ini? Akun tidak bisa lagi mengirim suara.'))return;run(()=>db.ref().update({['booths/'+b.dataset.rv]:null,['boothInfo/'+b.dataset.rv]:null}),'Akses dicabut.')});
  on('#add',()=>{read();cfg.candidates.push({no:String(cfg.candidates.length+1),name:'',photoK:'',photoW:'',visi:'',misi:''});renderAdmin(app)});
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('Hapus paslon ini?'))return;read();cfg.candidates.splice(b.dataset.del,1);renderAdmin(app)});
  app.querySelectorAll('[data-up]').forEach(e=>e.onchange=async()=>{const f=e.files[0];if(!f)return;read();cfg.candidates[e.dataset.i][e.dataset.up]=await shrink(f,520,'image/jpeg');saveCfg('Foto diunggah.')});
  const lg=$('#lg');if(lg)lg.onchange=async e=>{const f=e.target.files[0];if(!f)return;read();cfg.logo=await shrink(f,256,'image/png');saveCfg('Logo diunggah.')};
  on('#save',()=>{read();saveCfg('Perubahan tersimpan.')});
  on('#tog',()=>{cfg.open=!cfg.open;saveCfg(cfg.open?'Pemilihan dibuka.':'Pemilihan ditutup.')});
  const csv=$('#csv');if(csv)csv.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#vt').value=String(r.result).replace(/^\uFEFF/,'')};r.readAsText(f)};
  on('#imp',()=>{const o={};let n=0;String($('#vt').value).replace(/\r/g,'').split('\n').forEach((l,i)=>{if(!l.trim())return;const p=l.split(/[,;\t]/);if(i===0&&/nis/i.test(p[0]))return;const id=slug(p[0]);if(!id)return;o[id]={n:(p[1]||'').trim(),k:(p[2]||'').trim()};n++});
    if(!n){flash={t:'er',m:'Tidak ada data yang bisa dibaca.'};return renderAdmin(app)}
    run(()=>db.ref().update({voters:o,'stats/total':n}),n+' siswa tersimpan.')});
  on('#rst',()=>{if(!confirm('Hapus SEMUA suara dan status memilih?'))return;run(()=>db.ref().update({tally:null,voted:null,'stats/voted':0,'stats/guru':0}),'Semua suara direset.')});
}

if(!FB.apiKey.startsWith('ISI')){
  firebase.initializeApp(FB);db=firebase.database();auth=firebase.auth();
  db.ref('config').on('value',s=>{const d=s.val()||{};cfg={...cfg,...d,logo:d.logo||'',candidates:d.candidates?Object.values(d.candidates):[],open:d.open!==false};if(!typing())render()});
  db.ref('tally').on('value',s=>{tally=s.val()||{};if(tab==='layar')render()});
  db.ref('stats').on('value',s=>{stats={total:0,voted:0,...(s.val()||{})};if(tab==='layar'||(tab==='admin'&&!typing()))render()});
  auth.onAuthStateChanged(async u=>{me=u;role=null;
    if(u){try{const[a,b]=await Promise.all([db.ref('admins/'+u.uid).get(),db.ref('booths/'+u.uid).get()]);role=a.val()===true?'admin':b.val()===true?'booth':'none'}catch(e){role='none'}}
    if(role==='admin'&&!biOn){biOn=true;db.ref('boothInfo').on('value',x=>{bi=x.val()||{};if(tab==='admin'&&atab==='akun'&&!typing())render()},()=>{})}
    ready=true;render()});
}else render();
</script>
</body>
</html>
